name: Delete Merged Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete_merged_branch:
    runs-on: 'ubuntu-26.04'
    if: github.event.pull_request.merged == true && github.repository == github.event.pull_request.head.repo.full_name
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete branch
        run: |
          if [ "$HEAD_REF" != "main" ] && [ "$HEAD_REF" != "master" ]; then
            echo "Deleting branch ${HEAD_REF}"
            git push origin --delete "$HEAD_REF"
          else
            echo "Skipping deletion of main or master branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
